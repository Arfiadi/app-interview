version: '3.8'

services:
  # --- Service Postgres ---
  postgres:
    image: postgres:16-alpine
    container_name: interview_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: interview_db
      POSTGRES_USER: interview_user
      POSTGRES_PASSWORD: interview_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Service Redis ---
  redis:
    image: redis:7-alpine
    container_name: interview_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # --- Service Backend ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://interview_user:interview_password@postgres:5432/interview_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # --- Service Frontend ---
  frontend:
    build: 
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: interview_frontend
    ports:
      - "3005:3001"
    environment:
      - PYTHON_API_URL=http://backend:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3005
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: